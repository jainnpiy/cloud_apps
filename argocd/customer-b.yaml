apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: react-demo-cust-2
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jainnpiy/cloud_apps
    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true