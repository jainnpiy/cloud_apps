apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-app
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: react-app
  template:
    metadata:
      labels:
        app: react-app
    spec:
      containers:
        - name: react-app
          image: ghcr.io/jainnpiy/demo:07890f122d3bf84158c567e99cea318369d80f1d
          ports:
            - containerPort: 80
          imagePullPolicy: Always