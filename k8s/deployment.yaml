apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-app
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: react-app
  template:
    metadata:
      labels:
        app: react-app
    spec:
      containers:
        - name: react-app
          image: ghcr.io/jainnpiy/demo:88c304629e721b8ad54081df002946be7d7ecf6f
          ports:
            - containerPort: 80
          imagePullPolicy: Always